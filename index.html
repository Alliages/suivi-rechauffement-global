  .v-orange { color: var(--orange); }

  .opts { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin: 0 0 2px;

const I18N = {

    gifCourbe: "GIF · courbe", gifExtra: "GIF · extrapolation",
    zipCourbe: "Images · courbe (ZIP)", zipExtra: "Images · extrapolation (ZIP)",
    staticPng: "Graphique PNG", staticSvg: "Graphique SVG",
    yTitle: "Anomalie vs 1850-1900 (°C)",
    ipcc: "Projections GIEC (SR15)", likely: "Fourchette GIEC 1,5 °C (2030-2052)",
    series: "Anomalie mensuelle ERA5", window: "Anomalie observée (fenêtre de 30 ans)",
    trend: "Tendance linéaire 30 ans", crossing: "Atteinte de 1,5 °C",
    targetLabel: "1,5 °C",
    prelim: "provisoire", never: "non atteint",

  },
  en: {

    updated: "Data up to {m}", updatedDate: "updated {d}",
    allMonths: "every month",

    exportsTitle: "Exports", exportsChart: "Chart (current view)", exportsData: "Data",
    exportsAnim: "Animations and images (generated monthly)",
    csvMonthly: "Monthly series (CSV)", csvTrends: "30-year trends (CSV)", csvIpcc: "IPCC envelope (CSV)",
    gifCourbe: "GIF · curve", gifExtra: "GIF · extrapolation",
    zipCourbe: "Images · curve (ZIP)", zipExtra: "Images · extrapolation (ZIP)",
    staticPng: "Chart PNG", staticSvg: "Chart SVG",
    yTitle: "Anomaly vs 1850-1900 (°C)",
    ipcc: "IPCC projections (SR15)", likely: "IPCC 1.5 °C likely range (2030-2052)",
    series: "ERA5 monthly anomaly", window: "Observed anomaly (30-year window)",
    trend: "30-year linear trend", crossing: "1.5 °C reached",
    targetLabel: "1.5 °C",
    prelim: "preliminary", never: "not reached",
    methodTitle: "Method",
    method: [
      "2 m air temperature, ERA5 global mean published by Copernicus, aggregated to monthly means (complete months only).",
      "Anomaly relative to 1991-2020, converted to 1850-1900 by adding a fixed monthly offset (0.80 to 0.96 °C) from the C3S Climate Bulletin.",
      "Trend: 30-year linear regression. The 1.5 °C date extrapolates this line; it is not a forecast.",
      "The most recent months are preliminary (ERA5T) and may be slightly revised.",
      "Method taken from the Copernicus C3S “Global Temperature Trend Monitor”, reimplemented here for automatic monthly updates.",
    ],
    footer: "Data: Copernicus Climate Change Service (C3S) / ECMWF, ERA5. Projections: IPCC SR15. Unofficial tool, not produced or endorsed by Copernicus.",
    c3sMention: "The Copernicus Climate Change Service (C3S) is implemented by the European Centre for Medium-Range Weather Forecasts (ECMWF) on behalf of the European Commission is part of the European Union's space programme.",
    footerLinks: 'Version {v} · <a href="https://github.com/Alliages/suivi-rechauffement-global">Source code</a> · <a href="https://apps.climate.copernicus.eu/global-temperature-trend-monitor/">Original application (C3S)</a> · <a href="https://guillaume-meunier.fr/">Guillaume Meunier</a>',
  },
};

/* ======================================================================
   État
   ====================================================================== */
let DATA = null, MANIFEST = null, APP_VERSION = null, lang = "fr", steps = [], currentStep = 0;
const $ = (id) => document.getElementById(id);
const t = (k) => I18N[lang][k];
const N_DYNAMIC = 8;
const DYNAMIC_IDX = [4, 5, 6, 7, 8, 9, 10, 11];

/* ---------- Formatage ---------- */
const toDate = (m) => m + "-15";                       // AAAA-MM → 15 du mois
const fmtMonth = (m) => { const [y, mo] = m.split("-"); return `${MONTHS[lang][+mo - 1]} ${y}`; };
const fmtNum = (x, signed = false) =>
  (signed && x >= 0 ? "+" : "") + x.toLocaleString(lang, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function addMonths(m, k) {                              // 'AAAA-MM' + k mois (rÉal) → date ISO
  const [y, mo] = m.split("-").map(Number);
  const d = new Date(Date.UTC(y, mo - 1, 15));
  d.setUTCDate(d.getUTCDate() + Math.round(k * 30.4375));
  return d.toISOString().slice(0, 10);
}
const targetLabel = () => t("targetLabel");

/* ======================================================================
   Graphique
   ====================================================================== */
function trendRow(i) {
  const tr = DATA.trends;
  return Object.fromEntries(Object.keys(tr).map((k) => [k, tr[k][i]]));
}

function trendTraces(row) {
  const mon = DATA.monthly, cfg = DATA.config;
  const i0 = mon.month.indexOf(row.window_start), i1 = mon.month.indexOf(row.window_end);
  const m = row.slope_per_decade / 120, c = row.intercept;
  const kEnd = Math.max(m > 0 ? (cfg.target - c) / m : 0, i1 - i0);
  const endX = row.crossing_1_5 && i1 - i0 < kEnd ? toDate(row.crossing_1_5) : addMonths(row.window_start, kEnd);
  const endY = row.crossing_1_5 && i1 - i0 < kEnd ? cfg.target : c + m * kEnd;
  return {
    window: { x: mon.month.slice(i0, i1 + 1).map(toDate), y: mon.anomaly_preindustrial.slice(i0, i1 + 1) },
    trend: { x: [toDate(row.window_start), endX], y: [c, endY] },
    cross: row.crossing_1_5 ? { x: [toDate(row.crossing_1_5)], y: [cfg.target] } : { x: [], y: [] },
    current_y: row.warming_at_end,
  };
}

function yTicks([y0, y1]) {
  const vals = [];
  for (let v = Math.ceil(y0 * 2) / 2; v <= y1 + 1e-9; v += 0.5) vals.push(+v.toFixed(1));
  return {
    tickmode: "array", tickvals: vals,
    ticktext: vals.map((v, i) => i === vals.length - 1 ? `${v.toFixed(1)} °C` : v.toFixed(1)),
  };
}

function stepLabel(i) {
  const row = trendRow(steps[i]);
  return /^\d{4}$/.test(row.step_label) ? row.step_label : fmtMonth(row.window_end);
}

function stepAnnotations(row, tt) {
  const cfg = DATA.config;
  const cal = (m) => `<b>${fmtMonth(m)}</b>`;
  return [
    {
      text: ` <b>${targetLabel()}</b> `, xref: "paper", x: 1, xshift: 8,
      y: cfg.target, xanchor: "left", yanchor: "middle",
      showarrow: true, arrowhead: 2, arrowsize: 1, arrowwidth: 1.5, arrowcolor: C3S_RED,
      ax: 0, axref: "pixel", ay: -34, ayref: "pixel",
      font: { color: C3S_RED, size: 15 },
    },
    {
      text: ` <b>${fmtNum(tt.current_y)} °C</b> `, xref: "paper", x: 1, xshift: 6,
      y: tt.current_y, xanchor: "left", yanchor: "middle",
      showarrow: false, font: { color: ORANGE, size: 15 },
    },
    {
      text: cal(row.window_start), x: toDate(row.window_start), y: -0.02,
      xanchor: "center", yanchor: "top", showarrow: false,
      font: { color: ORANGE, size: 14 }, bgcolor: "white",
      bordercolor: ORANGE, borderwidth: 2, borderpad: 2,
    },
    row.crossing_1_5 ? {
      text: cal(row.crossing_1_5), x: toDate(row.crossing_1_5), y: -0.02,
      xanchor: "center", yanchor: "top", showarrow: false,
      font: { color: C3S_RED, size: 14 }, bgcolor: "white",
      bordercolor: C3S_RED, borderwidth: 2, borderpad: 2,
    } : { text: "", showarrow: false },
  ];
}

const X_VIEW = ["1950-01-01", "2055-01-01"];

function layout() {
  const cfg = DATA.config;
  const axis = { ticks: "outside", tickwidth: 1.5, tickfont: { size: 12 }, showgrid: false,
                 showline: false, zeroline: false };
  return {
    margin: { l: 70, r: 70, t: 130, b: 80 },
    font: { family: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif", color: "#1d1d1f", size: 14 },
    xaxis: { ...axis, type: "date", range: X_VIEW, dtick: "M120", tickformat: "%Y" },
    yaxis: { ...axis, range: cfg.y_range, showgrid: true, griddash: "dot", gridcolor: COLORS.grid,
             gridwidth: 1, zeroline: true, zerolinecolor: COLORS.zeroline, zerolinewidth: 1.5,
             fixedrange: true, ...yTicks(cfg.y_range) },
    legend: { x: 0.5, y: -0.10, xanchor: "center", yanchor: "top", orientation: "h", font: { size: 12 } },
    hovermode: "closest",
    sliders: [{
      active: steps.length - 1,
      x: 0, xanchor: "left", y: 1.24, len: 1,
      pad: { l: 0, r: 0, t: 0, b: 4 },
      font: { size: 11 },
      steps: steps.map((rowIdx, i) => ({ label: stepLabel(i), value: rowIdx, method: "skip", execute: false })),
    }],
    plot_bgcolor: "#fff", paper_bgcolor: "#fff",
  };
}

function staticTraces() {
  const mon = DATA.monthly, ipcc = DATA.ipcc, cfg = DATA.config;
  const yrs = ipcc.year.map((y) => `${y}-01-01`);
  return [
    { x: yrs, y: ipcc.min_t, mode: "lines", line: { width: 0 }, hoverinfo: "skip", showlegend: false },
    { x: yrs, y: ipcc.max_t, mode: "lines", line: { width: 0 }, fill: "tonexty",
      fillcolor: COLORS.ipcc, name: t("ipcc"), hoverinfo: "skip" },
    { x: cfg.likely_range, y: [cfg.target, cfg.target], mode: "lines+markers", name: t("likely"),
      line: { color: COLORS.likely, width: 3 },
      marker: { symbol: "diamond", size: 7, color: "white",
                line: { width: 3, color: COLORS.likely } },
      hoverinfo: "skip", showlegend: true },
    { x: mon.month.map(toDate), y: mon.anomaly_preindustrial, mode: "lines", name: t("series"),
      line: { color: COLORS.series, width: 1 },
      customdata: mon.month.map((m, i) => [fmtMonth(m), mon.status[i] === "preliminary" ? ` (${t("prelim")})` : ""]),
      hovertemplate: "%{customdata[0]} : %{y:+.2f} °C%{customdata[1]}<extra></extra>" },
  ];
}

function dynamicTraces(row, tt) {
  const cfg = DATA.config, xRight = cfg.x_range[1], yEnd = tt.current_y;
  const hoverCross = t("crossingHover")
    .replaceAll("{years}", 30)
    .replaceAll("{from}", fmtMonth(row.window_end))
    .replaceAll("{target}", targetLabel())
    .replaceAll("{to}", row.crossing_1_5 ? fmtMonth(row.crossing_1_5) : t("never"));
  const trendStart = { x: [tt.trend.x[0]], y: [tt.trend.y[0]] };
  const line = (x, y, color, extra = {}) => ({ x, y, mode: "lines", line: { color, width: 1 },
    hoverinfo: "skip", showlegend: false, ...extra });
  return [
    { ...tt.window, mode: "lines+markers", name: t("window"), showlegend: false,
      line: { color: COLORS.window, width: 1.2 },
      marker: { size: 6, color: "white", line: { width: 1, color: COLORS.window } }, hoverinfo: "skip" },
    line([toDate(row.window_start), toDate(row.window_start)], [tt.trend.y[0], 0], ORANGE),
    line([toDate(row.window_end), xRight], [yEnd, yEnd], ORANGE, { line: { color: ORANGE, width: 2, dash: "dot" } }),
    row.crossing_1_5
      ? line([toDate(row.crossing_1_5), toDate(row.crossing_1_5)], [cfg.target, 0], C3S_RED)
      : line([], [], C3S_RED),
    row.crossing_1_5
      ? line([toDate(row.crossing_1_5), xRight], [cfg.target, cfg.target], C3S_RED,
             { line: { color: C3S_RED, width: 2, dash: "dot" } })
      : line([], [], C3S_RED),
    { ...trendStart, x: [...trendStart.x, tt.trend.x[1]], y: [...trendStart.y, tt.trend.y[1]],
      mode: "lines", line: { color: "white", width: 5 }, hoverinfo: "skip", showlegend: false },
    { x: tt.trend.x, y: tt.trend.y, mode: "lines", name: t("trend"),
      line: { color: COLORS.trend, width: 2.5 }, hoverinfo: "skip" },
    { ...tt.cross, mode: "markers", showlegend: false, text: [hoverCross],
      hovertemplate: "%{text}<extra></extra>",
      hoverlabel: { bgcolor: C3S_RED, font: { color: "#fff" } },
      marker: { size: 15, color: "rgba(255, 255, 255, 0.5)", line: { color: C3S_RED, width: 1.5 } } },
  ];
}

function draw() {
  const last = steps.length - 1;
  currentStep = Math.min(currentStep, last);
  const row = trendRow(steps[currentStep]);
  const tt = trendTraces(row);
  Plotly.react("chart", [...staticTraces(), ...dynamicTraces(row, tt)],
    { ...layout(), annotations: stepAnnotations(row, tt) },
    { responsive: true, displaylogo: false,
      modeBarButtonsToRemove: ["select2d", "lasso2d"],
      toImageButtonOptions: { ...EXPORT_SIZE, filename: fileStem() } })
    .then(() => {
      updateCards(row);
      attachSliderEvents();
    });
}

function applyStep(i) {
  const chart = $("chart");
  const row = trendRow(steps[i]);
  const tt = trendTraces(row);
  const dyn = dynamicTraces(row, tt);
  Plotly.restyle(chart, {
    x: dyn.map((tr) => tr.x),
    y: dyn.map((tr) => tr.y),
    text: dyn.map((tr) => tr.text || null),
  }, DYNAMIC_IDX);
  Plotly.relayout(chart, { annotations: stepAnnotations(row, tt) });
  updateCards(row);
  currentStep = i;
}

function attachSliderEvents() {
  const chart = $("chart");
  if (chart._sliderHooked) return;
  chart._sliderHooked = true;
  chart.on("plotly_sliderchange", (ev) => {
    const s = ev.slider && typeof ev.slider.active === "number" ? ev.slider
      : chart._fullLayout && chart._fullLayout.sliders && chart._fullLayout.sliders[0];
    const idx = s && typeof s.active === "number" ? s.active : currentStep;
    if (idx !== currentStep && idx >= 0 && idx < steps.length) applyStep(idx);
  });
}

/* ======================================================================
   Textes, synthèse
   ====================================================================== */
function monthFull(mKey) {
  const [y, m] = mKey.split("-");
  return `${MONTHS_FULL[lang][+m - 1]} ${y}`;
}

function updateCards(row) {
  const mon = DATA.monthly, n = mon.month.length - 1;
  $("quand").innerHTML = t("syntheseTitle").replace("{m}", monthFull(row.window_end));
  $("s-month").innerHTML = `${fmtNum(mon.anomaly_preindustrial[n], true)} °C` +
    (mon.status[n] === "preliminary" ? ` <span class="prelim">(${t("prelim")})</span>` : "");
  $("s-warming").textContent = `${fmtNum(row.warming_at_end, true)} °C`;
  $("s-crossing").textContent = row.crossing_1_5 ? fmtMonth(row.crossing_1_5) : t("never");
}

function buildSteps() {
  const tr = DATA.trends, all = $("all-months").checked;
  steps = tr.window_end.map((_, i) => i).filter((i) => all || tr.is_slider_step[i]);
  currentStep = steps.length - 1;
}

const FAQ = {"fr": [{"q": "Qu'est-ce que le Global Temperature Trend Monitor ?", "a": "<p>Le Global Temperature Trend Monitor du Copernicus Climate Change Service (C3S) fournit chaque mois une mise à jour de la température globale de l'air en surface, ainsi qu'une indication du moment où le réchauffement mondial pourrait atteindre la limite de 1,5 °C fixée par l'accord de Paris sur le climat. À partir de tendances linéaires sur 30 ans, l'outil explore comment le niveau de réchauffement mondial par rapport aux températures préindustrielles a évolué depuis l'an 2000, et comment le rythme auquel nous nous approchons de 1,5 °C a évolué au cours du temps.</p>\n<p>Le Global Temperature Trend Monitor est avant tout un outil de suivi ; la date indicative n'est là qu'à titre d'illustration et ne doit pas être interprétée comme une prévision.</p>\n<p>Il permet simplement de :</p><ul>\n<li>suivre les variations mensuelles des températures globales de l'air en surface par rapport à la période préindustrielle ;</li>\n<li>visualiser le réchauffement mondial estimé à un instant donné depuis l'an 2000 ;</li>\n<li>voir, par l'extrapolation d'une tendance linéaire, une estimation de la date à laquelle le réchauffement mondial pourrait atteindre la limite de 1,5 °C fixée par l'accord de Paris ;</li>\n<li>explorer comment cette estimation varie selon les périodes de 30 ans utilisées pour le calcul de la tendance.</li></ul>"}, {"q": "Comment utiliser l'application ?", "a": "<p>L'application visualise, dans un graphique interactif en courbes, le changement de température observé depuis l'époque préindustrielle (1850-1900).</p>\n<p>Le curseur au-dessus du graphique peut être déplacé pour mettre en évidence la période de 30 ans précédant la date choisie. La plage s'étend de décembre 2000 au dernier mois disponible, avec un pas mensuel pour les douze derniers mois et un pas annuel pour le reste de la période.</p>\n<p>La période sélectionnée d'anomalies mensuelles de la température mondiale est représentée en orange.</p>\n<p>La ligne rouge épaisse représente la tendance linéaire sur la période de 30 ans sélectionnée, prolongée jusqu'au point où elle atteint un réchauffement mondial total de 1,5 °C ; cela donne une estimation de la date à laquelle la limite de 1,5 °C pourrait être franchie, si la tendance des 30 ans sélectionnés se poursuivait.</p>\n<p>La zone orange ombrée représente les données des projections climatiques fournies par le Groupe d'experts intergouvernemental sur l'évolution du climat (GIEC), formant une enveloppe d'incertitude illustrative autour de l'estimation du réchauffement issue de la réanalyse. Elle est fondée sur l'intervalle interquartile des modèles retenus par le GIEC dans son rapport spécial de 2018 sur le réchauffement de 1,5 °C.</p>\n<p>Le déplacement du curseur permet d'explorer l'évolution du rythme du réchauffement mondial depuis l'an 2000 et notre proximité de la limite de 1,5 °C.</p>"}, {"q": "D'où viennent les données ?", "a": "<p>Pour les changements de température observés, cette application utilise les données mensuelles de la température globale de l'air en surface de la réanalyse mondiale ERA5 produite par le C3S (premier jeu de données ci-dessous). Les anomalies mensuelles par rapport à la période de référence 1991-2020 sont calculées à partir d'une climatologie mensuelle ERA5 (second jeu de données ci-dessous). Cette climatologie inclut une correction de température sur les Grands Lacs américains. Les deux jeux de données sont disponibles dans le Climate Data Store (CDS) du C3S :</p><ul>\n<li><a href=\"https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels-monthly-means\">ERA5 monthly averaged data on single levels from 1940 to present</a> — « ERA5 est la cinquième génération de réanalyse de l'ECMWF pour le climat et la météo mondiaux des 8 dernières décennies. Les données sont disponibles à partir de 1940. ERA5 remplace la réanalyse ERA-Interim. La réanalyse combine données de modèle et observations du monde entier en un jeu de données globalement complet et cohérent… »</li>\n<li><a href=\"https://cds.climate.copernicus.eu/datasets/ecv-for-climate-change?tab=overview\">Essential climate variables for assessment of climate variability from 1979 to present</a> — « Ce jeu de données contient une sélection de climatologies, d'anomalies mensuelles et de champs de moyennes mensuelles de variables climatiques essentielles, adaptés au suivi et à l'évaluation de la variabilité et du changement climatiques… »</li></ul>\n<p>Des données issues de projections climatiques sont également utilisées pour fournir une enveloppe d'incertitude illustrative autour de l'estimation du réchauffement issue de la réanalyse. Ces données sont extraites de la figure 1 du résumé pour les décideurs du rapport spécial de 2018 du GIEC sur le réchauffement de 1,5 °C. Elles montrent l'évolution projetée de la température si les émissions de CO2 diminuaient progressivement pour atteindre zéro en 2055, tandis que les niveaux des autres gaz à effet de serre cessent d'augmenter après 2030. Les données sont utilisées dans l'application sans aucun contrôle qualité et leur présentation ici ne constitue pas une approbation du C3S.</p>"}, {"q": "Quand l'application est-elle mise à jour ?", "a": "<p>Cet outil est mis à jour automatiquement via GitHub Actions les <strong>4, 8 et 15 de chaque mois</strong>.</p>\n<p>Ce calendrier suit la disponibilité du jeu de données <a href=\"https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels-monthly-means\">ERA5 monthly averaged data on single levels from 1940 to present</a> dans le Climate Data Store, disponible autour du <strong>6 du mois</strong> pour le mois précédent.</p>"}, {"q": "Comment l'écart par rapport à l'époque préindustrielle est-il calculé ?", "a": "<p>ERA5 ne remontant qu'à 1940, un écart de température doit être appliqué pour convertir les anomalies globales de la période de référence 1991-2020 à la période préindustrielle 1850-1900. Cet écart reflète le changement moyen de température entre ces deux périodes, sur la base de plusieurs jeux de données remontant à 1850.</p>\n<p>Pour les moyennes annuelles et sur 12 mois, un écart constant de 0,88 °C est appliqué aux anomalies par rapport à 1991-2020, conformément à l'approche de l'OMM dans ses rapports sur l'état du climat mondial. Cette méthode est toutefois inadaptée aux anomalies mensuelles, en raison des différences saisonnières de rythme de réchauffement entre 1850-1900 et 1991-2020. On utilise donc des écarts mensuels, en supposant un rythme de réchauffement variant progressivement au fil de l'année. Ces écarts mensuels sont indiqués dans le tableau ci-dessous.</p>\n<p>De plus amples détails sur la méthode figurent dans le <a href=\"https://climate.copernicus.eu/climate-bulletins\">Bulletin climatique du C3S</a>.</p>\n<table><caption>Tableau 1 : écarts de température mensuels et moyen annuel (en °C) utilisés pour convertir les anomalies ERA5 (réf. 1991-2020) en anomalies par rapport à 1850-1900.</caption><thead><tr><th scope=\"col\">Mois</th><th>Jan</th><th>Fév</th><th>Mar</th><th>Avr</th><th>Mai</th><th>Juin</th><th>Juil</th><th>Août</th><th>Sep</th><th>Oct</th><th>Nov</th><th>Déc</th><th scope=\"col\">Année</th></tr></thead><tbody><tr><td>Écart appliqué</td><td>0.96</td><td>0.96</td><td>0.95</td><td>0.91</td><td>0.87</td><td>0.83</td><td>0.80</td><td>0.80</td><td>0.81</td><td>0.85</td><td>0.89</td><td>0.93</td><td>0.88</td></tr></tbody></table>"}, {"q": "Quelles sont les limites de la méthodologie ?", "a": "<p>Le modèle présenté ici n'a pas vocation à prédire l'avenir : c'est une illustration simple mais plausible de l'évolution possible du réchauffement mondial dans les années et décennies à venir. L'ajout d'autres jeux de données et de méthodes alternatives d'estimation de la tendance pourrait modifier légèrement les chiffres affichés, sans remettre en cause le fait qu'il s'agit d'une simplification et qu'un modèle plus complexe serait nécessaire pour couvrir l'ensemble des incertitudes. L'enveloppe d'incertitude donnée par les projections de modèles climatiques, ainsi que l'estimation probable indiquée par la barre orange du rapport du GIEC sur les 1,5 °C, reflète le niveau d'incertitude inhérent à une telle estimation.</p>"}, {"q": "Comment citer les données et les images de ce site ?", "a": "<p>Tous les utilisateurs des produits Copernicus doivent fournir une attribution claire et visible au programme Copernicus.</p>\n<p>Le <strong><a href=\"https://climate.copernicus.eu/\">Copernicus Climate Change Service (C3S)</a></strong> est mis en œuvre par l'<strong><a href=\"https://www.ecmwf.int/\">European Centre for Medium-Range Weather Forecasts (ECMWF)</a></strong> pour le compte de la Commission européenne et fait partie du programme spatial de l'Union européenne.</p>\n<p>Cet outil est un outil non officiel, non produit ni approuvé par Copernicus. Crédit suggéré : « Suivi du réchauffement mondial — seuil de 1,5 °C (d'après C3S/ECMWF, ERA5) » ; données : Copernicus Climate Change Service (C3S), réanalyse ERA5 ; projections : GIEC, rapport spécial de 2018.</p>"}], "en": [{"q": "What is the global temperature trend monitor?", "a": "<p>The Copernicus Climate Change Service (C3S) global temperature trend monitor provides monthly updates on global surface air temperature, and an indication of when global warming might reach the 1.5 °C limit set out in the Paris Agreement on climate change. Using 30-year linear trends, the monitor explores how the level of global warming against pre-industrial temperatures has changed since the year 2000, and how the rate at which we approach the 1.5 °C has evolved over time.</p>\n<p>The global temperature trend monitor is first and foremost a monitoring tool, and the indicative future date is there for illustrative purposes only and should not be interpreted as a forecast.</p>\n<p>The global temperature trend monitor provides a simple way to:</p><ul>\n<li>Track the monthly changes in global surface air temperatures compared to the pre-industrial period;</li>\n<li>View the estimated global warming at a point in time over the past years;</li>\n<li>See an estimate, through the extrapolation of a linear trend, of when global warming might reach the 1.5 °C limit set by the Paris Agreement;</li>\n<li>Explore how this estimate changes based on different 30-year periods used for trend calculations.</li></ul>"}, {"q": "How should the application be used?", "a": "<p>The C3S global temperature trend monitor visualises the observed temperature change since pre-industrial times (1850-1900) in an interactive line graph.</p>\n<p>The slider above the graph can be moved to highlight the 30-year period leading up to the selected date. The range spans from December 2000 to the most recent available month, with a monthly frequency for the latest twelve months and a yearly frequency for the rest of the period.</p>\n<p>The selected 30-year period of monthly global temperature anomalies is shown in orange.</p>\n<p>The thick red line represents the linear trend over the selected 30-year period, extended all the way to the point at which it reaches total global warming of 1.5 °C; this provides an estimate of when the 1.5 °C limit might be breached, if the selected 30-year trend were to continue.</p>\n<p>The shaded orange area represents data from climate projections provided by the Intergovernmental Panel on Climate Change (IPCC), providing an illustrative envelope of uncertainty around the global warming estimate derived from reanalysis. This is based on the interquartile range of the set models chosen by the IPCC in the 2018 special report on global warming of 1.5 °C.</p>\n<p>Moving the slider back and forth allows you to explore how the rate of global warming has changed since the year 2000, and how close we are to reaching the 1.5 °C limit.</p>"}, {"q": "Where do the data come from?", "a": "<p>For observed temperature changes, this application uses monthly global surface air temperature data from the ERA5 global reanalysis produced by C3S (first dataset below). Monthly anomalies relative to the 1991-2020 reference period are calculated using an ERA5 monthly climatology (second dataset below). This climatology includes a temperature correction over the US Great Lakes. Both datasets are available in the C3S Climate Data Store (CDS):</p><ul>\n<li><a href=\"https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels-monthly-means\">ERA5 monthly averaged data on single levels from 1940 to present</a> — \"ERA5 is the fifth generation ECMWF reanalysis for the global climate and weather for the past 8 decades. Data is available from 1940 onwards. ERA5 replaces the ERA-Interim reanalysis. Reanalysis combines model data with observations from across the world into a globally complete and consistent datas…\"</li>\n<li><a href=\"https://cds.climate.copernicus.eu/datasets/ecv-for-climate-change?tab=overview\">Essential climate variables for assessment of climate variability from 1979 to present</a> — \"The Essential Climate Variables for assessment of climate variability from 1979 to present dataset contains a selection of climatologies, monthly anomalies and monthly mean fields of Essential Climate Variables (ECVs) suitable for monitoring and assessment of climate variability and change. Selectio…\"</li></ul>\n<p>Temperature data from climate projections are also used to provide an illustrative envelope of uncertainty around the global warming estimate derived from reanalysis. This data is extracted from Figure 1 in the summary for policymakers of the 2018 IPCC special report on global warming of 1.5 °C. It shows the projected temperature evolution if CO2 emissions gradually decrease to zero by 2055, while other greenhouse gas levels stop changing after 2030. Data are used in the application without any quality control and their representation here is not an endorsement by C3S.</p>"}, {"q": "When is the global temperature trend monitor updated?", "a": "<p>This tool is automatically updated via GitHub Actions on the <strong>4th, 8th and 15th of each month</strong>.</p>\n<p>This is in line with the availability of the <a href=\"https://cds.climate.copernicus.eu/datasets/reanalysis-era5-single-levels-monthly-means\">ERA5 monthly averaged data on single levels from 1940 to present</a> dataset in the Climate Data Store, available from around the <strong>6th of each month</strong> for the previous month.</p>"}, {"q": "How is the temperature change against pre-industrial times calculated?", "a": "<p>Since ERA5 only extends back to 1940, a temperature offset must be applied to convert global temperature anomalies from the 1991-2020 reference period to the 1850-1900 pre-industrial period. This offset reflects the average temperature change between these two periods, based on several datasets going back to 1850.</p>\n<p>For annual and 12-month averages, a constant offset of 0.88 °C is applied to anomalies relative to 1991-2020, consistent with the WMO's approach in its State of the Global Climate reports. However, this method is inadequate for monthly anomalies due to seasonal differences in warming rates between 1850-1900 and 1991-2020. Therefore, monthly varying offsets are used, based on the assumption of a smoothly varying warming rate throughout the year. These monthly offsets are shown in the table below.</p>\n<p>More details about the method can be found on the <a href=\"https://climate.copernicus.eu/climate-bulletins\">C3S Climate Bulletin</a> pages.</p>\n<table><caption>Table 1: Monthly and annual mean temperature offsets (in °C) used to convert ERA5 anomalies relative to 1991-2020 to anomalies relative to 1850-1900.</caption><thead><tr><th scope=\"col\">Month</th><th>Jan</th><th>Feb</th><th>Mar</th><th>Apr</th><th>May</th><th>Jun</th><th>Jul</th><th>Aug</th><th>Sep</th><th>Oct</th><th>Nov</th><th>Dec</th><th scope=\"col\">Annual Mean</th></tr></thead><tbody><tr><td>Applied offset</td><td>0.96</td><td>0.96</td><td>0.95</td><td>0.91</td><td>0.87</td><td>0.83</td><td>0.80</td><td>0.80</td><td>0.81</td><td>0.85</td><td>0.89</td><td>0.93</td><td>0.88</td></tr></tbody></table>"}, {"q": "What are the limitations of the methodology?", "a": "<p>The model presented here is not intended as a prediction but rather as a simplified yet plausible illustration of how global warming may evolve in the coming years and decades. Introducing additional datasets and alternative methods for estimating the trend might slightly alter the numbers shown, but this would not change the fact that the model is a simplification and that a more complex model is needed to encompass the full range of uncertainties. The uncertainty envelope given by the projections made with climate models, as well as the likely estimate indicated by the orange bar from the IPCC 1.5 °C report, reflects the level of uncertainty inherent in making such a prediction.</p>"}, {"q": "How should data and images from this website be cited?", "a": "<p>All users of Copernicus Products must provide clear and visible attribution to the Copernicus programme.</p>\n<p>The <strong><a href=\"https://climate.copernicus.eu/\">Copernicus Climate Change Service (C3S)</a></strong> is implemented by the <strong><a href=\"https://www.ecmwf.int/\">European Centre for Medium-Range Weather Forecasts (ECMWF)</a></strong> on behalf of the European Commission and is part of the European Union's space programme.</p>\n<p>This is an unofficial tool, not produced or endorsed by Copernicus. Suggested credit: \"Global warming tracking — 1.5 °C threshold (after C3S/ECMWF, ERA5)\"; data: Copernicus Climate Change Service (C3S), ERA5 reanalysis; projections: IPCC, 2018 special report.</p>"}]};

const GLOSSARY = {"fr": [{"term": "Réchauffement mondial", "def": "<p>Dans cette application, le <strong>réchauffement mondial</strong> à un instant donné désigne l'augmentation d'une moyenne sur 30 ans, centrée sur cet instant, de la température globale de surface de la Terre par rapport à la période préindustrielle.</p>"}, {"term": "Limite de 1,5 °C", "def": "<p>La limite de <strong>1,5 °C</strong> fixée par l'accord de Paris est un objectif pour la température moyenne de la planète sur une période de vingt ou trente ans. Pour plus d'informations, voir le <a href=\"https://unfccc.int/process-and-meetings/the-paris-agreement\">site de la Convention-cadre des Nations unies sur les changements climatiques (CCNUCC)</a>.</p>"}, {"term": "Accord de Paris", "def": "<p>L'<strong>accord de Paris</strong> est un traité international adopté en 2015 lors de la 21<sup>e</sup> Conférence des Parties (COP21) de la Convention-cadre des Nations unies sur les changements climatiques (CCNUCC). Pour plus d'informations, voir le <a href=\"https://unfccc.int/process-and-meetings/the-paris-agreement\">site de la CCNUCC</a>.</p>"}, {"term": "Préindustriel", "def": "<p>La période <strong>préindustrielle</strong> sert de référence aux objectifs de réchauffement mondial fixés par l'accord de Paris. Elle est généralement définie comme les 51 ans allant de 1850 à 1900 — la définition utilisée par cette application.</p>"}, {"term": "Projections GIEC", "def": "<p>Cette application inclut des <strong>projections climatiques</strong> fournies par le <strong>Groupe d'experts intergouvernemental sur l'évolution du climat (GIEC)</strong>, formant une enveloppe d'incertitude illustrative autour de l'estimation du réchauffement issue de la réanalyse. Elle est fondée sur l'intervalle interquartile des modèles retenus par le GIEC dans son <a href=\"https://www.ipcc.ch/sr15/\">rapport spécial de 2018</a> sur le réchauffement de 1,5 °C.</p>"}, {"term": "Réanalyse climatique", "def": "<p>Une <strong>réanalyse climatique</strong> est produite en combinant les sorties d'un modèle de prévision numérique du temps et des observations du système Terre collectées partout dans le monde (satellites, stations météo et autres instruments de l'atmosphère, de l'océan et du sol) grâce à une technique mathématique complexe appelée assimilation de données. Le résultat est un jeu de données globalement complet et temporellement cohérent couvrant plus de 80 ans, qui permet d'évaluer l'évolution à long terme du climat de la Terre.</p>"}], "en": [{"term": "Global Warming", "def": "<p>In this application, <strong>global warming</strong> at a point in time refers to the increase in a 30-year average, centred on the specified time, of Earth's global surface temperature relative to the pre-industrial period.</p>"}, {"term": "1.5 °C limit", "def": "<p>The <strong>1.5 °C</strong> limit set in the Paris Agreement is a target for the average temperature of the planet over a twenty or thirty-year period. For more information, see the <a href=\"https://unfccc.int/process-and-meetings/the-paris-agreement\">United Nations Framework Convention on Climate Change (UNFCCC) website</a>.</p>"}, {"term": "Paris Agreement", "def": "<p>The <strong>Paris Agreement</strong> is an international treaty adopted in 2015 during the 21st Conference of the Parties (COP21) to the United Nations Framework Convention on Climate Change (UNFCCC). For more information, see the <a href=\"https://unfccc.int/process-and-meetings/the-paris-agreement\">UNFCCC website</a>.</p>"}, {"term": "Pre-industrial", "def": "<p>The <strong>pre-industrial</strong> period is used as a reference for the global warming targets set in the Paris Agreement. It is commonly defined as the 51-year period from 1850 to 1900, which is the definition used by this application.</p>"}, {"term": "IPCC projections", "def": "<p>This application includes <strong>climate projections</strong> provided by the <strong>Intergovernmental Panel on Climate Change (IPCC)</strong>, providing an illustrative envelope of uncertainty around the global warming estimate derived from reanalysis. This is based on the interquartile range of the set models chosen by the IPCC in the <a href=\"https://www.ipcc.ch/sr15/\">2018 special report</a> on global warming of 1.5 °C.</p>"}, {"term": "Climate reanalysis", "def": "<p>A <strong>climate reanalysis</strong> is produced by combining the output from a numerical weather prediction model with observations of the Earth system from across the world (including those coming from satellites, weather stations, and other instruments in the atmosphere, ocean and on land) through a complex mathematical technique known as data assimilation. The result is a globally complete and temporally consistent dataset spanning more than 80 years, enabling us to assess long-term changes in Earth's climate.</p>"}]};

const SOURCE = {"fr": "<h2>Code source</h2>\n<p>L'intégralité du code de cet outil est libre et disponible sur <strong><a href=\"https://github.com/Alliages/suivi-rechauffement-global\">GitHub — Alliages/suivi-rechauffement-global</a></strong>. L'application originale est celle du <a href=\"https://apps.climate.copernicus.eu/global-temperature-trend-monitor/\">Copernicus Climate Change Service</a>.</p>\n<h3>Résumé du fonctionnement</h3>\n<ul>\n<li><strong>Objectif :</strong> suivre chaque mois le réchauffement mondial (températures ERA5, C3S/ECMWF) face au seuil de 1,5 °C fixé par l'accord de Paris, et estimer — à titre purement indicatif — la date d'atteinte du seuil par extrapolation d'une tendance linéaire sur 30 ans. Ce n'est pas une prévision.</li>\n<li><strong>Données :</strong> anomalies mensuelles de la température globale (ERA5, référence 1991-2020, converties vers la période préindustrielle 1850-1900) et enveloppe d'incertitude issue des projections du GIEC (rapport spécial de 2018, SR15).</li>\n<li><strong>Traitement :</strong> un pipeline Python (dossier <code>pipeline/</code>) télécharge les données, calcule les tendances glissantes de 30 ans, la date d'atteinte et l'enveloppe, et génère <code>data/series.json</code>.</li>\n<li><strong>Mise à jour et déploiement :</strong> un workflow GitHub Actions (<code>.github/workflows/mise-a-jour.yml</code>) exécute le pipeline le 4, le 8 et le 15 de chaque mois, puis publie automatiquement le site statique sur GitHub Pages.</li>\n<li><strong>Stack :</strong> une page unique <code>index.html</code> (Plotly.js), sans dépendance à un service tiers.</li>\n</ul>", "en": "<h2>Source code</h2>\n<p>The complete code of this tool is free and available on <strong><a href=\"https://github.com/Alliages/suivi-rechauffement-global\">GitHub — Alliages/suivi-rechauffement-global</a></strong>. The original application is the <a href=\"https://apps.climate.copernicus.eu/global-temperature-trend-monitor/\">Copernicus Climate Change Service</a> one.</p>\n<h3>How it works</h3>\n<ul>\n<li><strong>Purpose:</strong> track global warming (ERA5 temperatures, C3S/ECMWF) against the 1.5 °C threshold set in the Paris Agreement on a monthly basis, and estimate — for illustration only — when the threshold would be reached by extrapolating a 30-year linear trend. This is not a forecast.</li>\n<li><strong>Data:</strong> monthly global temperature anomalies (ERA5, 1991-2020 reference, converted to the 1850-1900 pre-industrial period) and an uncertainty envelope from IPCC projections (2018 special report, SR15).</li>\n<li><strong>Processing:</strong> a Python pipeline (<code>pipeline/</code>) downloads the data, computes rolling 30-year trends, the crossing date and the envelope, and generates <code>data/series.json</code>.</li>\n<li><strong>Updates and deployment:</strong> a GitHub Actions workflow (<code>.github/workflows/mise-a-jour.yml</code>) runs the pipeline on the 4th, 8th and 15th of each month, then automatically publishes the static site to GitHub Pages.</li>\n<li><strong>Stack:</strong> a single <code>index.html</code> page (Plotly.js), with no third-party service dependency.</li>\n</ul>"};

function renderGlossary() {
  const list = $("glossary-list"), defBox = $("glossary-def");
  if (!list || !defBox) return;
  list.innerHTML = "";
  defBox.innerHTML = "";
  const terms = GLOSSARY[lang] || [];
  terms.forEach((item, i) => {
    const li = document.createElement("li");
    const btn = document.createElement("button");
    btn.textContent = item.term;
    btn.setAttribute("aria-current", i === 0 ? "true" : "false");
    btn.addEventListener("click", () => {
      list.querySelectorAll("button").forEach((b) => b.setAttribute("aria-current", b === btn ? "true" : "false"));
      defBox.innerHTML = item.def;
    });
    li.appendChild(btn);
    list.appendChild(li);
  });
  if (terms.length) defBox.innerHTML = terms[0].def;
}

function renderFaq() {
  const list = $("faq-list");
  if (!list) return;
  list.innerHTML = "";
  (FAQ[lang] || []).forEach((item, i) => {
    const li = document.createElement("li");
    if (i > 0) li.className = "closed";
    const h3 = document.createElement("h3");
    h3.textContent = item.q;
    h3.addEventListener("click", () => li.classList.toggle("closed"));
    const body = document.createElement("div");
    body.innerHTML = item.a;
    li.appendChild(h3);
    li.appendChild(body);
    list.appendChild(li);
  });
}

function initTabs() {
  const tabIds = ["apropos", "faq", "glossaire", "source"];
  document.querySelectorAll("#tabs button").forEach((btn) => btn.addEventListener("click", () => {
    document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b === btn ? "true" : "false"));
    tabIds.forEach((t) => { const p = $("panel-" + t); if (p) p.hidden = t !== btn.dataset.tab; });
  }));
}

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const mon = DATA.monthly, n = mon.month.length - 1;
  $("synthese").innerHTML = `
    <p class="p1">${t("synthese1").replace("{m1}", monthFull(mon.month[n]))} <strong class="v v-orange" id="s-month"></strong></p>
    <div class="encart" id="encart">
      <h2 class="quand" id="quand"></h2>
      <p>${t("synthese2")} <strong class="v v-red" id="s-warming"></strong></p>
      <p>${t("synthese3").replace("{target}", targetLabel())} <strong class="v v-red" id="s-crossing"></strong></p>
    </div>`;
  $("method").innerHTML = t("method").map((li) => `<li>${li}</li>`).join("");
  renderGlossary();
  renderFaq();
  $("source-content").innerHTML = SOURCE[lang] || "";
  $("footer").innerHTML = `<p class="credit">${t("footer")}</p>`
    + `<p class="credit mention">${t("c3sMention")}</p>`
    + `<p class="credit">${t("footerLinks").replace("{v}", APP_VERSION ?? "—")}</p>`;
  const meta = DATA.meta;
  $("updated").innerHTML = t("updated").replace("{m}", fmtMonth(meta.last_month))
    + "<br>" + t("updatedDate").replace("{d}", new Date(meta.generated_at).toLocaleDateString(lang));
  document.title = t("title");
  renderManifest();
  draw();
}

/* ======================================================================
   Exports
   ====================================================================== */
function fileStem() {
  const row = trendRow(steps[currentStep]);
  return `rechauffement_1-5C_extrapolation-${row.window_end}_${lang}`;
}

function renderManifest() {
  const box = $("exports");
  box.querySelectorAll("[data-manifest]").forEach((el) => el.remove());
  if (!MANIFEST) return;
  $("anim-group").hidden = false;
  const items = [
    ["courbe_gif", "gifCourbe"], ["extrapolation_gif", "gifExtra"],
    ["courbe_zip", "zipCourbe"], ["extrapolation_zip", "zipExtra"],
    [`static_${lang}_png`, "staticPng"], [`static_${lang}_svg`, "staticSvg"],
  ];
  for (const [key, label] of items) {
    if (!MANIFEST[key]) continue;
    const a = document.createElement("a");
    a.href = `exports/${MANIFEST[key]}`; a.download = ""; a.textContent = t(label);
    a.dataset.manifest = "1";
    box.appendChild(a);
  }
}

$("exports").addEventListener("click", (e) => {
  const fmt = e.target.dataset && e.target.dataset.export;
  if (fmt) Plotly.downloadImage("chart", { format: fmt, ...EXPORT_SIZE, filename: fileStem() });
});

/* ======================================================================
   Démarrage
   ====================================================================== */
$("all-months").addEventListener("change", () => { buildSteps(); draw(); });
document.querySelectorAll(".lang button").forEach((b) =>
  b.addEventListener("click", () => { lang = b.dataset.lang; applyLang(); }));

(async function init() {
  DATA = await (await fetch(DATA_URL, { cache: "no-cache" })).json();
  try { MANIFEST = await (await fetch(MANIFEST_URL, { cache: "no-cache" })).json(); } catch (_) { MANIFEST = null; }
  try { APP_VERSION = (await (await fetch("VERSION", { cache: "no-cache" })).text()).trim(); } catch (_) { APP_VERSION = null; }
  if (navigator.language && !navigator.language.startsWith("fr")) lang = "en";
  buildSteps();
  applyLang();
  initTabs();
})();
</script>
</body>
</html>
