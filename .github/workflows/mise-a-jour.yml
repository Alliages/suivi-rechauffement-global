# Mise à jour automatique : données ERA5, images, GIF, publication GitHub Pages.
#
# Déclenchement :
#   - le 4, le 8 et le 15 de chaque mois (le mois précédent devient complet
#     vers le 3 ; les passages suivants prennent en compte les révisions) ;
#   - à la main : onglet Actions > « Mise à jour mensuelle » > Run workflow ;
#   - à chaque modification de la page ou du pipeline sur main.
name: Mise à jour mensuelle

on:
  schedule:
    - cron: "23 5 4,8,15 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["index.html", "vendor/**", "pipeline/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write     # commit des données
  pages: write        # publication
  id-token: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Épinglées par SHA de commit (supply chain) ; le commentaire garde la version.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Tests de la méthode
        run: python -m pytest -q tests

      - name: Données, calculs, images et GIF
        # Échoue (et n'écrase rien) si les contrôles qualité ne passent pas
        run: python pipeline/main.py --site --render

      - name: Commit des données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/era5_global_monthly.csv data/trends.csv data/ipcc_sr15.csv; then
            echo "Pas de nouvelles données."
          else
            git commit -m "Données ERA5 jusqu'à $(jq -r .last_month data/meta.json)"
            git push
          fi

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
