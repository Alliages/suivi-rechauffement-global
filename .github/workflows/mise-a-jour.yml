# Mise à jour automatique : données ERA5, images, GIF, publication GitHub Pages.
#
# Déclenchement :
#   - le 4, le 8 et le 15 de chaque mois (le mois précédent devient complet
#     vers le 3 ; les passages suivants prennent en compte les révisions) ;
#   - à la main : onglet Actions > « Mise à jour mensuelle » > Run workflow ;
#   - à chaque modification de la page ou du pipeline sur main.
name: Mise à jour mensuelle

on:
  schedule:
    - cron: "23 5 4,8,15 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write     # commit des données
  pages: write        # publication
  id-token: write

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Tests de la méthode
        run: python -m pytest -q tests

      - name: Données, calculs, images et GIF
        # Échoue (et n'écrase rien) si les contrôles qualité ne passent pas
        run: python pipeline/main.py --site --render

      - name: Commit des données si elles ont changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/era5_global_monthly.csv data/trends.csv data/ipcc_sr15.csv; then
            echo "Pas de nouvelles données."
          else
            git commit -m "Données ERA5 jusqu'à $(jq -r .last_month data/meta.json)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
