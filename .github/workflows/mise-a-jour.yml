# Mise à jour automatique : données ERA5, images, GIF, publication GitHub Pages.
#
# Déclenchement :
#   - le 5 de chaque mois (le mois précédent est complet dans Climate Pulse
#     vers le 3), comme l'application officielle C3S ;
#   - à la main : onglet Actions > « Mise à jour mensuelle » > Run workflow ;
#   - à chaque modification de la page ou du pipeline sur main.
name: Mise à jour mensuelle

on:
  schedule:
    - cron: "23 5 5 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "style.css"
      - "favicon.svg"
      - "VERSION"
      - "vendor/**"
      - "pipeline/**"
      - "requirements.txt"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # commit des données
    steps:
      # Épinglées par SHA de commit (supply chain) ; le commentaire garde la version.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Tests de la méthode
        run: python -m pytest -q tests

      - name: Données, calculs, images et GIF
        # Échoue (et n'écrase rien) si les contrôles qualité ne passent pas
        run: python pipeline/main.py --site --render

      - name: Commit des données si elles ont changé
        # meta.json et series.json portent l'heure de génération : on les
        # compare sans ce champ pour ne pas commiter à chaque passage.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          sans_heure() { jq -S 'del(.meta.generated_at, .generated_at)' "$@"; }
          if git diff --cached --quiet -- data/ ':(exclude)data/meta.json' ':(exclude)data/series.json' \
             && diff -q <(git show HEAD:data/series.json | sans_heure) <(sans_heure data/series.json) >/dev/null; then
            echo "Pas de nouvelles données."
          else
            git commit -m "Données ERA5 jusqu'à $(jq -r .last_month data/meta.json)"
            git push
          fi

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  # Vulnérabilités connues des dépendances : signalées sans bloquer la publication
  # (Dependabot propose ensuite la montée de version).
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.9.0 && pip-audit -r requirements.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
